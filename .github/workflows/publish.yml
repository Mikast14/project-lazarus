# Rebuilds the site and republishes it every time main changes.
# The build is pushed to the gh-pages branch, which GitHub Pages serves.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:   # also runnable by hand from the Actions tab

permissions:
  contents: write      # needed to push the gh-pages branch

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Push the build to gh-pages
        working-directory: frontend/dist
        run: |
          rm -f music.mp3          # never publish a music file, even if one is ever committed
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
